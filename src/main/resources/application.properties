spring.application.name=delta-brief
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Actuator auto-adds a mail health indicator that tests real SMTP
# connectivity to Resend on every health check — a transient SMTP hiccup
# would otherwise drag down the whole /actuator/health status Render uses
# to decide whether to keep routing traffic to this service. Registration
# already handles mail failures gracefully (RegistrationService), so this
# indicator isn't needed for the app's own health signal.
management.health.mail.enabled=false
# Boot-time stub only, NOT a real credential: Spring AI's OpenAI audio-speech
# autoconfiguration eagerly validates that some credential is present, even
# though nothing calls the AI client in this deployment. Overridden by the
# real SPRING_AI_OPENAI_API_KEY env var once AI features are actually wired.
spring.ai.openai.api-key=placeholder-not-a-real-key
# Local defaults point at the docker-compose Postgres (non-secret dev
# credentials); Render's real SPRING_DATASOURCE_* env vars override these
# transparently when deployed, same pattern as server.port above.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/deltabrief}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:deltabrief}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:deltabrief}
# Capped per infrastructure.md's risk register — Supabase's Supavisor pooler
# has its own connection multiplexing limits.
spring.datasource.hikari.maximum-pool-size=5
# Supavisor's transaction-mode pooler hands out a different physical server
# connection per transaction, but the JDBC driver's server-side prepared
# statement cache assumes a stable one — causing intermittent
# "prepared statement already exists" errors under real traffic. Disabling
# server-side prepared statements (falling back to simple/extended query
# protocol) is the standard fix for JDBC + PgBouncer/Supavisor transaction
# pooling. Harmless against the local non-pooled Postgres too.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
# Resend's SMTP relay (see https://resend.com/docs/send-with-smtp). The local
# default requires a free Resend account/API key for the developer to test
# with; onboarding@resend.dev can only deliver to that account's own email
# until a real domain is verified with Resend (wired via Render env vars once
# that happens - see plan.md Phase 4).
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY:placeholder-not-a-real-key}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Without these, a slow/unreachable SMTP server hangs the registration
# request indefinitely instead of failing fast.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM_ADDRESS:onboarding@resend.dev}
# Used to build the verification link sent by email; Render sets this to the
# real deployed URL.
app.base-url=${APP_BASE_URL:http://localhost:8080}
