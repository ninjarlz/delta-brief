<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>Your topics — DeltaBrief</title>
	<link rel="stylesheet" th:href="@{/css/pico.min.css}"/>
	<link rel="stylesheet" th:href="@{/css/app.css}"/>
	<script th:src="@{/js/app.js}" defer></script>
</head>
<body>
	<nav th:replace="~{fragments/navbar :: navbar}"></nav>
	<main class="app-content">
		<header class="page-header">
			<div>
				<h1>Your topics</h1>
				<p class="subtitle">What's changed, tracked in one place.</p>
			</div>
			<a th:if="${!#lists.isEmpty(topics)}" th:href="@{/topics/new}" role="button">Create topic</a>
		</header>

		<div class="empty-state" th:if="${#lists.isEmpty(topics)}">
			<p>You're not watching any topics yet.</p>
			<a th:href="@{/topics/new}" role="button">Create your first topic</a>
		</div>

		<ul class="topic-list" th:unless="${#lists.isEmpty(topics)}">
			<li class="topic-card" th:each="topic : ${topics}">
				<div class="topic-card__info">
					<span class="topic-card__name" th:text="${topic.name}"></span>
					<span class="topic-card__category" th:text="${topic.categoryName}"></span>
					<span class="topic-card__schedule">Next briefing:
						<span th:text="${topic.nextDueAt}" th:data-timestamp="${topic.nextDueAtIso}"></span>
					</span>
					<span class="topic-card__schedule-failed" th:if="${topic.lastRunFailed}">
						⚠ Last scheduled attempt failed — will retry automatically</span>
				</div>
				<div class="topic-card__actions">
					<form th:action="@{/topics/{id}/briefings(id=${topic.id})}" method="post">
						<button type="submit" class="topic-card__generate outline" data-busy-text="Generating…">Generate briefing</button>
					</form>
					<a th:href="@{/topics/{id}/briefings(id=${topic.id})}" role="button" class="topic-card__history outline">View briefings</a>
					<a th:href="@{/topics/{id}/edit(id=${topic.id})}" role="button" class="topic-card__edit outline">Edit schedule</a>
					<form th:action="@{/topics/{id}/delete(id=${topic.id})}" method="post">
						<button type="submit" class="topic-card__delete secondary outline">Delete</button>
					</form>
				</div>
			</li>
		</ul>
	</main>
</body>
</html>
