<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>Your topics — DeltaBrief</title>
	<link rel="stylesheet" th:href="@{/css/pico.min.css}"/>
	<link rel="stylesheet" th:href="@{/css/app.css}"/>
	<script th:src="@{/js/app.js}" defer></script>
</head>
<body>
	<nav th:replace="~{fragments/navbar :: navbar}"></nav>
	<main class="app-content">
		<header class="page-header">
			<div>
				<h1>Your topics</h1>
				<p class="subtitle">What's changed, tracked in one place.</p>
			</div>
			<a th:if="${!#lists.isEmpty(topics)}" th:href="@{/topics/new}" role="button">Create topic</a>
		</header>

		<div class="empty-state" th:if="${#lists.isEmpty(topics)}">
			<p>You're not watching any topics yet.</p>
			<a th:href="@{/topics/new}" role="button">Create your first topic</a>
		</div>

		<ul class="topic-list" th:unless="${#lists.isEmpty(topics)}">
			<li class="topic-card" th:each="topic : ${topics}">
				<div class="topic-card__info">
					<span class="topic-card__name" th:text="${topic.name}"></span>
					<span class="topic-card__category" th:text="${topic.categoryName}"></span>
				</div>
				<form th:action="@{/topics/{id}/delete(id=${topic.id})}" method="post">
					<button type="submit" class="topic-card__delete secondary outline">Delete</button>
				</form>
			</li>
		</ul>
	</main>
</body>
</html>
