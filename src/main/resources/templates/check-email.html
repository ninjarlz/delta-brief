<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>Check your email — DeltaBrief</title>
	<link rel="stylesheet" th:href="@{/css/pico.min.css}"/>
	<link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
	<div class="center-content">
		<main class="auth-card">
			<h1>Check your email</h1>
			<p class="subtitle">We've sent a verification link to the address you registered with.</p>
			<p>Click the link in that email to verify your account, then log in.</p>
			<p class="switch-link"><a th:href="@{/resend-verification}">Didn't get it? Resend verification email</a></p>
			<p class="switch-link"><a th:href="@{/login}">Back to login</a></p>
		</main>
	</div>
</body>
</html>
