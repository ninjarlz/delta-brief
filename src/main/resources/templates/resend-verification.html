<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>Resend verification email — DeltaBrief</title>
	<link rel="stylesheet" th:href="@{/css/pico.min.css}"/>
	<link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
	<main class="auth-card">
		<h1>Resend verification email</h1>
		<p class="subtitle">Enter your email and, if an unverified account exists, we'll send a new link.</p>
		<form th:action="@{/resend-verification}" method="post">
			<label for="email">Email
				<input type="email" id="email" name="email" autocomplete="email" required/>
			</label>
			<button type="submit">Resend link</button>
		</form>
		<p class="switch-link"><a th:href="@{/login}">Back to login</a></p>
	</main>
</body>
</html>
