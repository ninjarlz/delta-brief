<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>Create a topic — DeltaBrief</title>
	<link rel="stylesheet" th:href="@{/css/pico.min.css}"/>
	<link rel="stylesheet" th:href="@{/css/app.css}"/>
	<script th:src="@{/js/app.js}" defer></script>
</head>
<body>
	<nav th:replace="~{fragments/navbar :: navbar}"></nav>
	<main class="app-content">
		<div class="auth-card">
			<h1>Create a topic</h1>
			<p class="subtitle">Pick a name and a category — DeltaBrief tracks that category's preset sources for you.</p>
			<form th:action="@{/topics}" th:object="${createTopicRequest}" method="post">
				<label for="name">Topic name
					<input type="text" id="name" th:field="*{name}" placeholder="e.g. War in Ukraine"
						th:aria-invalid="${#fields.hasErrors('name')} ? 'true' : null"/>
					<small class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
				</label>
				<label for="categoryId">Category
					<select id="categoryId" th:field="*{categoryId}"
						th:aria-invalid="${#fields.hasErrors('categoryId')} ? 'true' : null">
						<option th:each="category : ${categories}" th:value="${category.id.value}"
							th:text="${category.name}"></option>
					</select>
					<small class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></small>
				</label>
				<label for="description">Observation goal (optional)
					<textarea id="description" th:field="*{description}" rows="3"
						placeholder="e.g. I'm tracking this because I have family there — I care about the humanitarian angle more than the politics."
						th:aria-invalid="${#fields.hasErrors('description')} ? 'true' : null"></textarea>
					<small class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></small>
					<small>Helps DeltaBrief tailor what counts as significant when generating your briefings.</small>
				</label>
				<label for="frequency">Briefing frequency
					<select id="frequency" th:field="*{frequency}"
						th:aria-invalid="${#fields.hasErrors('frequency')} ? 'true' : null">
						<option th:each="option : ${frequencyOptions}" th:value="${option.value}" th:text="${option.label}"></option>
					</select>
					<small class="field-error" th:if="${#fields.hasErrors('frequency')}" th:errors="*{frequency}"></small>
				</label>
				<label for="preferredTimeLocal">Preferred time (your local time, optional)
					<input type="time" id="preferredTimeLocal" data-preferred-time-local/>
					<input type="hidden" id="preferredTime" th:field="*{preferredTime}" data-preferred-time-utc/>
					<small class="field-error" th:if="${#fields.hasErrors('preferredTime')}" th:errors="*{preferredTime}"></small>
					<small data-preferred-time-help>DeltaBrief nudges automatic generation toward this time when set.
						Leave blank to use the default (9:00 UTC).</small>
				</label>
				<label for="emailEnabled" class="checkbox-field">
					<input type="checkbox" id="emailEnabled" th:field="*{emailEnabled}"/>
					<span>Email me new briefings for this topic <small>(recommended)</small></span>
				</label>

				<div class="coming-soon-panel">
					<div class="coming-soon-panel__header">
						<span>Custom sources</span>
						<span class="coming-soon-panel__badge">Coming soon</span>
					</div>
					<p class="coming-soon-panel__text">Your category brings all of its preset sources along
						automatically. Picking individual sources will be available in a future update.</p>
				</div>

				<small class="field-error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></small>
				<button type="submit">Create topic</button>
			</form>
			<p class="switch-link"><a th:href="@{/}">Back to your topics</a></p>
		</div>
	</main>
</body>
</html>
