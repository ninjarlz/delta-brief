<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>Register — DeltaBrief</title>
</head>
<body>
	<main>
		<h1>Create an account</h1>
		<form th:action="@{/register}" th:object="${registrationRequest}" method="post">
			<div>
				<label for="email">Email</label>
				<input type="email" id="email" th:field="*{email}"/>
				<span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
			</div>
			<div>
				<label for="password">Password</label>
				<input type="password" id="password" th:field="*{password}"/>
				<span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
			</div>
			<div>
				<label for="confirmPassword">Confirm password</label>
				<input type="password" id="confirmPassword" th:field="*{confirmPassword}"/>
				<span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
			</div>
			<button type="submit">Register</button>
		</form>
		<p><a th:href="@{/login}">Already have an account? Log in</a></p>
	</main>
</body>
</html>
