plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'pl.tul'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

configurations {
	all {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}
}

ext {
	springAiVersion = '2.0.0'
	testcontainersVersion = '2.0.5'
	mapstructVersion = '1.6.3'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-log4j2'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	// testcontainers-bom doesn't resolve reliably through io.spring.dependency-management
	// (unlike spring-ai-bom above) — Gradle's native platform() import is the documented,
	// reliable path for this specific BOM.
	testImplementation platform("org.testcontainers:testcontainers-bom:${testcontainersVersion}")
	// Testcontainers 2.x renamed every module with a testcontainers- prefix
	// (was org.testcontainers:postgresql in 1.x). testcontainers-postgresql pulls in
	// the core testcontainers artifact transitively (GenericContainer, Wait, etc.) —
	// no separate core or junit-jupiter module needed since container lifecycle is
	// managed manually, not via @Testcontainers/@Container (see
	// DeltaBriefApplicationTests for why: @ServiceConnection doesn't support the
	// host-network GenericContainer the local (VPN-constrained) mode requires).
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// CI/local Testcontainers mode is selected via the CI Spring profile, set here
	// (not read directly in application code) so bean selection stays declarative —
	// see TestcontainersDatasourceConfig.
	def isCi = (System.getenv('CI') ?: 'false').toBoolean()
	if (isCi) {
		systemProperty 'spring.profiles.active', 'CI'
	} else {
		// Ryuk doesn't reliably manage host-network Testcontainers (required locally
		// when a VPN/Docker bridge-networking conflict is present — see
		// TestcontainersDatasourceConfig).
		environment 'TESTCONTAINERS_RYUK_DISABLED', 'true'
	}
}

bootJar {
	archiveFileName = 'app.jar'
}

tasks.named('bootRun') {
	// Auto-loads a gitignored .env file for local secrets so
	// `./gradlew bootRun` picks them up with no extra flags. Never used for
	// CI/deployed environments — those set real env vars directly (Render,
	// GitHub Actions).
	def envFile = file('.env')
	if (envFile.exists()) {
		envFile.readLines().each { line ->
			line = line.trim()
			if (line && !line.startsWith('#')) {
				def parts = line.split('=', 2)
				if (parts.length == 2 && parts[1].trim()) {
					environment parts[0].trim(), parts[1].trim()
				}
			}
		}
	}
}
